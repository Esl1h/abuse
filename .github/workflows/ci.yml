name: CI

on:
  push:
    branches: ["master", "sdl3", "modernisation", "phase-*/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  # No data file without a manifest entry, no licence outside the allowed
  # list, nothing from classic/ in the package.
  licenses:
    name: Licences (manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest
        run: ./scripts/check-licenses.sh

  linux:
    name: Linux (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Dependencies
        run: |
          sudo apt-get update
          # No distribution packages SDL3 yet, so CPM builds it from source and
          # every one of SDL3's own build dependencies has to be installed
          # here. This is the list from docs/README-linux.md in SDL
          # release-3.4.14, the tag CMakeLists pins, minus what the runner
          # already has and minus libaudio-dev, which Ubuntu dropped.
          #
          # Leaving one out does not disable a feature, it fails the configure
          # step: SDL treats a missing dependency for an enabled subsystem as
          # an error.
          #
          # ImageMagick provides the 'compare' the snapshot suites use.
          sudo apt-get install -y --no-install-recommends \
            ninja-build imagemagick \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libfribidi-dev libthai-dev libusb-1.0-0-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-linux-

      # The headless preset exists for exactly this: no ccache, no mold and
      # no native MIDI, none of which a runner has. The dev preset hard-sets
      # -fuse-ld=mold, and CMake fails its very first compiler test without it.
      - name: Configure
        run: cmake --preset headless

      - name: Build
        run: cmake --build --preset headless

      # Unit tests, replays and snapshots. The snapshots need no Xvfb:
      # --headless uses SDL's dummy drivers, and the framebuffer is dumped
      # straight from the indexed surface.
      - name: Test
        run: ctest --preset headless

      - name: Artefacts of the failing tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-output
          path: |
            build/headless/Testing/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: abuse-linux
          path: build/headless/src/abuse

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-windows-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DABUSE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      # Everything, not just the unit tests. The replay suite is the one
      # that matters here: it checks that the simulation reaches the same
      # state on this platform as it does on Linux. The snapshot suites skip
      # themselves when ImageMagick's compare is absent, which it is here.
      - name: Tests
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: abuse-windows
          path: build/src/Release/

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install ninja imagemagick

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-macos-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-macos-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DABUSE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: abuse-macos
          path: build/src/abuse

  # Advisory, not blocking. clang-tidy exits zero even with warnings
  # (WarningsAsErrors is empty in .clang-tidy), and a PR touching an
  # inherited file prints dozens of pre-existing ones: 165 in level.cpp, 144
  # in lisp/lisp.cpp, 84 in game.cpp. The value is in the new modules, and it
  # grows as new code replaces the old.
  clang-tidy:
    name: clang-tidy (diff, consultivo)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-tidy \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-linux-

      # Only generates compile_commands.json; no need to build the project.
      - name: Configure
        run: cmake --preset headless

      # Only the files the PR changed, as AGENTS.md section 5 requires.
      - name: Analyse the diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.cpp' \
                  | grep -v '^build/' || true)
          if [ -z "$files" ]; then
            echo "nenhum .cpp alterado"
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086
          clang-tidy -p build/headless $files

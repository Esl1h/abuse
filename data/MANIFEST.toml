[[asset]]
# Ours, and these must come before the addon/** glob below: the checker takes
# the first glob that matches.
#
# The levels are compiled by tools/asciimap from a text grid, on top of a
# template taken from the shipped levels. What comes from the template is the
# object table and the Lisp descriptors, which are Crack dot Com's and public
# domain; what is ours is the tile maps and where the objects sit. Which tile
# goes where is also learned from the shipped levels, by tools/asciimap/learn.
path = "addon/challenge/maps/**"
origin = "Abuse: Vrenna, compiled from a netlevel template (Crack dot Com, public domain)"
license = "public-domain"
modified = true
ai_tool = "Claude Code"
ai_model = "claude-opus-5"
ai_date = "2026-09-20"
ai_note = "layout authored as an ASCII grid; tiles chosen by tools/asciimap"


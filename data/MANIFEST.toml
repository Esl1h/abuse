# ============================================================
# Identity: the icon and the key art
# ============================================================

# Generated for this project in 2026-09. The icon is a 1024x1024 master with
# a transparent background; every size under freedesktop/icons/ and
# doc/icon.ico are derived from it by scripts/make-icons.sh and are not
# separate artworks.
#
# ai_tool and ai_model carry the same string because that is the name the
# author gave, and one name is what there is. Writing a longer one here
# would be a guess about what the product is underneath.
#
# The trademark symbol the generator put after ABUSE was removed from the
# icon on 2026-09-22: the game is public domain and this project holds no
# mark, so claiming one would be a statement that is not true.

# Outside data/, so scripts/check-licenses.sh does not walk them: it checks
